id: wellness_older_adult
topic: "Older Adult Wellness Visit (50-64)"
category: wellness
specialties:
  - im
visit_type: wellness
age_range: "50-64 years"
teaching_goals:
  - Ensure all age-appropriate cancer screenings are current including colorectal, breast, cervical, and lung cancer
  - Initiate lung cancer screening with low-dose CT for eligible patients with significant smoking history
  - Manage cardiovascular risk comprehensively with lifestyle modification and statin therapy guided by ASCVD risk
  - Screen for and manage emerging metabolic diseases including diabetes, CKD, and osteoporosis risk
  - Administer Shingrix vaccine and ensure all routine immunizations are current
common_mistakes:
  - Not initiating lung cancer screening in patients with 20+ pack-year history who currently smoke or quit within 15 years
  - Forgetting Shingrix vaccine starting at age 50 — it is a 2-dose series and is the most commonly missed vaccine in this age group
  - Stopping cervical cancer screening prematurely before age 65 without confirming adequate prior screening
  - Not calculating ASCVD risk and having an informed discussion about statin therapy
red_flags:
  - Unintentional weight loss greater than 5% in 6 months (malignancy workup needed)
  - Iron deficiency anemia in a man or postmenopausal woman (GI malignancy until proven otherwise)
  - New-onset diabetes after age 50 — consider pancreatic cancer in patients with otherwise low risk
  - Hematuria (even a single episode) — requires urologic evaluation to exclude bladder or renal malignancy
clinical_pearls:
  - "Lung cancer screening with low-dose CT reduces lung cancer mortality by 20% (NLST trial); eligible patients: age 50-80, 20+ pack-year history, currently smoking or quit within 15 years"
  - "Shingrix is 90%+ effective against herpes zoster and is recommended for all immunocompetent adults 50+; 2 doses at 0 and 2-6 months"
  - "New iron deficiency anemia in men or postmenopausal women needs GI evaluation — bidirectional endoscopy is standard of care"
  - "Abdominal aortic aneurysm screening: one-time ultrasound for men aged 65-75 who have ever smoked (USPSTF Grade B)"
  - "Osteoporosis screening with DEXA is recommended for postmenopausal women under 65 if FRAX 10-year major osteoporotic fracture risk >= 9.3%"
key_history_questions:
  - "What is your smoking history? Have you ever smoked? How many pack-years? When did you quit?"
  - "Are you up to date on your colonoscopy, mammogram, and Pap smear? When were they last done?"
  - "Have you noticed any blood in your stool, urine, or sputum, or any unexplained weight loss?"
  - "Do you have a family history of colon, breast, lung, or prostate cancer?"
  - "Have you been vaccinated for shingles? Did you complete the 2-dose Shingrix series?"
  - "How is your mood? Are you sleeping well? Any changes in energy, appetite, or concentration?"
screening_recommendations:
  - name: "Blood pressure screening"
    frequency: "Every visit"
    guideline: "USPSTF Grade A"
  - name: "Colorectal cancer screening"
    frequency: "Colonoscopy every 10 years, FIT annually, or FIT-DNA every 1-3 years (ages 45-75)"
    guideline: "USPSTF Grade A"
  - name: "Breast cancer screening (mammography)"
    frequency: "Biennial mammography ages 40-74"
    guideline: "USPSTF Grade B (2024)"
  - name: "Cervical cancer screening"
    frequency: "HPV testing alone every 5 years, Pap every 3 years, or co-testing every 5 years through age 65"
    guideline: "USPSTF Grade A — can stop at 65 if adequate prior screening and not high risk"
  - name: "Lung cancer screening (low-dose CT)"
    frequency: "Annual for ages 50-80 with 20+ pack-year history and currently smoking or quit within 15 years"
    guideline: "USPSTF Grade B"
  - name: "Prediabetes/Type 2 diabetes screening"
    frequency: "Every 3 years for adults 35-70 with BMI >= 25"
    guideline: "USPSTF Grade B"
  - name: "Lipid panel and ASCVD risk assessment"
    frequency: "Every 5 years; more frequently if on statin therapy or borderline risk"
    guideline: "USPSTF Grade B — statin for primary prevention ages 40-75 with ASCVD risk >= 10% and CVD risk factor"
  - name: "Depression screening"
    frequency: "Annually"
    guideline: "USPSTF Grade B"
  - name: "Hepatitis C screening"
    frequency: "Once for all adults 18-79 if not previously screened"
    guideline: "USPSTF Grade B"
  - name: "HIV screening"
    frequency: "At least once for all adults through age 65; more frequently if high risk"
    guideline: "USPSTF Grade A"
  - name: "Osteoporosis screening (DEXA)"
    frequency: "Postmenopausal women under 65 with risk factors (use FRAX); universal for women at 65"
    guideline: "USPSTF Grade B"
  - name: "Abdominal aortic aneurysm screening"
    frequency: "One-time ultrasound for men 65-75 who have ever smoked"
    guideline: "USPSTF Grade B — assess smoking history now so screening is not missed at 65"
  - name: "Tobacco use screening and cessation"
    frequency: "Every visit"
    guideline: "USPSTF Grade A"
  - name: "Unhealthy alcohol use screening"
    frequency: "Annually"
    guideline: "USPSTF Grade B"
immunizations_due:
  - vaccine: "Influenza"
    frequency: "Annual"
    notes: "All adults annually; high-dose or adjuvanted formulations not indicated until age 65"
  - vaccine: "Tdap/Td"
    frequency: "Td or Tdap booster every 10 years"
    notes: "Tdap once if not previously received"
  - vaccine: "Zoster (Shingrix)"
    frequency: "2-dose series starting at age 50"
    notes: "0 and 2-6 months apart; recommended regardless of prior varicella history or prior Zostavax"
  - vaccine: "COVID-19"
    frequency: "Per current ACIP guidance"
    notes: "Updated formulation per current season"
  - vaccine: "Hepatitis B"
    frequency: "3-dose series if not previously vaccinated (adults 19-59; shared decision 60+)"
    notes: "Complete series if not previously vaccinated"
  - vaccine: "Pneumococcal"
    frequency: "Not routinely indicated until age 65 for immunocompetent adults"
    notes: "Give PCV20 now if immunocompromised, asplenia, cochlear implants, CSF leak, or chronic conditions (heart, lung, liver disease, diabetes, alcoholism, smoking)"
anticipatory_guidance:
  safety:
    - "Seatbelt use and no distracted driving"
    - "Firearm safety — safe storage counseling"
    - "Fall prevention — assess home safety, vision, footwear, and medications that increase fall risk"
    - "Skin cancer awareness — monthly self-exams, sun protection"
  nutrition:
    - "Heart-healthy dietary pattern (Mediterranean or DASH)"
    - "Calcium 1000-1200 mg/day and Vitamin D 600-800 IU/day for bone health"
    - "Fiber intake 25-30 g/day for GI health and cardiovascular benefit"
    - "Limit sodium to < 2300 mg/day (or < 1500 mg if hypertensive)"
    - "Address sarcopenia risk — adequate protein intake 1.0-1.2 g/kg/day"
  exercise:
    - "150 minutes of moderate-intensity or 75 minutes of vigorous-intensity aerobic activity per week"
    - "Muscle-strengthening activities 2+ days per week — critical for bone density and fall prevention"
    - "Balance and flexibility exercises — yoga, tai chi"
    - "Exercise stress test before starting vigorous exercise if multiple CVD risk factors and previously sedentary"
  mental_health:
    - "Screen for depression and anxiety — retirement planning, empty nest, caregiving stress"
    - "Sleep assessment — evaluate for obstructive sleep apnea, insomnia"
    - "Cognitive health — encourage mentally stimulating activities, social engagement"
    - "Address caregiver burnout for those managing aging parents"
  substance_use:
    - "Tobacco cessation — lung cancer screening eligibility depends on pack-year history; quitting reduces risk at any age"
    - "Alcohol — reassess consumption; increased cancer risk with even moderate drinking"
    - "Opioid use disorder screening if chronic pain present"
  sexual_health:
    - "Menopause management — vasomotor symptoms, vaginal atrophy, bone health"
    - "Erectile dysfunction — screen for cardiovascular disease and depression as underlying causes"
    - "STI screening if new sexual partners"
    - "Prostate health discussion — PSA screening is a shared decision (USPSTF Grade C for men 55-69)"
sources:
  - "USPSTF A and B Recommendations, current as of 2024-2025"
  - "USPSTF Final Recommendation: Lung Cancer Screening (2021)"
  - "USPSTF Final Recommendation: Breast Cancer Screening (2024)"
  - "USPSTF Final Recommendation: Colorectal Cancer Screening (2021)"
  - "USPSTF Final Recommendation: Osteoporosis Screening (2018)"
  - "CDC/ACIP Recommended Adult Immunization Schedule, 2025"
  - "AHA/ACC Guideline on Primary Prevention of Cardiovascular Disease (2019)"
  - "NLST: National Lung Screening Trial Results (NEJM 2011)"
