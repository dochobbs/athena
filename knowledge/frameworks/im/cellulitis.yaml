id: cellulitis
topic: Cellulitis
category: infectious_disease
specialties:
- im
teaching_goals:
- Distinguish purulent from non-purulent cellulitis and guide therapy
- Identify features requiring IV antibiotics and hospitalization
- Recognize mimics of cellulitis (DVT, stasis dermatitis, contact dermatitis)
- Understand MRSA risk factors and when to cover empirically
common_mistakes:
- Treating bilateral lower extremity erythema as cellulitis (usually stasis dermatitis)
- Not marking borders to monitor progression
- Using MRSA coverage for all non-purulent cellulitis
- Missing underlying abscess requiring I&D
red_flags:
- Rapid spread despite antibiotics
- Pain out of proportion (consider necrotizing fasciitis)
- Crepitus on palpation
- Systemic toxicity or hemodynamic instability
- Immunosuppressed host with cellulitis
clinical_pearls:
- Cellulitis is almost never bilateral - consider stasis dermatitis
- Mark the leading edge with a skin marker to track progression
- Erythema may worsen in the first 24-48h despite appropriate therapy
- Tinea pedis is the most common portal of entry for lower extremity cellulitis
key_history_questions:
- When did the redness start and how quickly has it spread?
- Any preceding wound, bite, or skin break?
- History of tinea pedis or lymphedema?
- Prior episodes of cellulitis?
- Diabetes or immunosuppression?
- Any purulent drainage or abscess?
key_exam_findings:
- Erythema with indistinct borders, warmth, tenderness
- Lymphangitic streaking
- Regional lymphadenopathy
- Fluctuance suggesting abscess
- Crepitus (red flag for necrotizing infection)
- Portal of entry (interdigital maceration, wound)
treatment_principles:
- 'Non-purulent: cephalexin or dicloxacillin (strep coverage)'
- 'Purulent: TMP-SMX or doxycycline (MRSA coverage) plus I&D if abscess'
- Elevate affected extremity
- Treat predisposing conditions (tinea pedis, edema)
disposition_guidance:
- Outpatient for mild, non-toxic patients with reliable follow-up
- Admit for systemic toxicity, rapid spread, facial cellulitis, or failed outpatient
  therapy
- Urgent surgical consultation if necrotizing fasciitis suspected
