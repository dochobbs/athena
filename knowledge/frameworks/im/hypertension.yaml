id: hypertension
topic: "Hypertension"
category: cardiology
specialties:
  - im
teaching_goals:
  - Classify BP correctly using ACC/AHA 2017 guidelines
  - Select appropriate first-line antihypertensive based on comorbidities
  - Recognize secondary causes of hypertension
  - Understand target organ damage screening
  - Counsel on lifestyle modifications (DASH diet, exercise, sodium restriction)
common_mistakes:
  - Diagnosing HTN from a single elevated reading instead of requiring confirmation
  - Not checking for orthostatic hypotension before starting treatment
  - Starting multiple medications simultaneously rather than stepwise
  - Ignoring secondary causes in young patients or resistant HTN
  - Not screening for end-organ damage (renal function, urine albumin, ECG)
red_flags:
  - BP >180/120 with headache, vision changes, or chest pain (hypertensive emergency)
  - New renal failure with severe HTN (malignant nephrosclerosis)
  - Flash pulmonary edema with bilateral renal artery stenosis
  - Papilledema on fundoscopy
clinical_pearls:
  - ACC/AHA 2017 defines Stage 1 HTN as 130-139/80-89
  - ACE inhibitors and ARBs are first-line with DM or proteinuria
  - CCBs and thiazides preferred in Black patients per ALLHAT
  - Never combine ACE inhibitor + ARB (hyperkalemia, renal failure, no benefit)
  - Resistant HTN = uncontrolled on 3 drugs including a diuretic; screen for secondary causes
key_history_questions:
  - How long have you had high blood pressure?
  - What medications have you tried? Any side effects?
  - Do you have diabetes, kidney disease, or heart disease?
  - Family history of hypertension or early cardiovascular disease?
  - How much sodium do you consume? Exercise habits?
  - Any symptoms of secondary causes (snoring, palpitations, flank pain)?
key_exam_findings:
  - Bilateral arm BP measurements
  - Fundoscopic exam for hypertensive retinopathy
  - Cardiac exam for S4, murmurs
  - Abdominal exam for renal bruits
  - Peripheral pulses for coarctation
treatment_principles:
  - Lifestyle modifications for all stages
  - Pharmacotherapy threshold depends on CV risk and BP stage
  - Start single agent, titrate before adding second
  - Combination therapy for Stage 2 (>= 160/100)
  - Follow-up within 1 month of medication changes
disposition_guidance:
  - Outpatient management for uncomplicated HTN
  - Emergency department if end-organ damage suspected
  - Urgent follow-up for Stage 2 HTN at diagnosis
