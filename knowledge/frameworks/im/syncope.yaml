id: syncope
topic: Syncope
category: cardiology
specialties:
- im
teaching_goals:
- Classify syncope etiologically (reflex, orthostatic, cardiac)
- Risk stratify using clinical features and validated scores
- Recognize high-risk features suggesting cardiac syncope
- Perform proper orthostatic vital signs
- Avoid unnecessary and low-yield testing
common_mistakes:
- Ordering head CT and carotid ultrasound for simple syncope
- Not checking orthostatic vital signs
- Missing cardiac syncope red flags (exertional, supine, preceded by palpitations)
- Admitting all syncope patients regardless of risk
- Not obtaining ECG on every syncope patient
red_flags:
- Exertional syncope (aortic stenosis, HOCM, arrhythmia)
- Syncope while supine or sitting
- Preceded by palpitations (arrhythmia)
- Family history of sudden cardiac death
- Abnormal ECG (long QT, Brugada, pre-excitation)
clinical_pearls:
- Vasovagal syncope has prodrome (warmth, nausea, diaphoresis, tunnel vision)
- Cardiac syncope is sudden, without prodrome, and may occur supine
- ECG is the single most important test in syncope evaluation
- Carotid sinus massage can diagnose carotid sinus hypersensitivity
- Most syncope is benign (vasovagal 20-40%), but cardiac syncope doubles mortality
key_history_questions:
- What were you doing when you passed out?
- Did you have any warning signs before losing consciousness?
- How long were you unconscious?
- Did anyone see it happen? Any seizure activity?
- Have you had episodes like this before?
- Family history of sudden death or arrhythmia?
key_exam_findings:
- Orthostatic vital signs (lying, sitting, standing)
- Cardiac murmurs (especially aortic stenosis)
- Carotid bruits
- Neurologic exam (should be normal in true syncope)
- ECG for arrhythmia, prolonged QT, pre-excitation, Brugada
- Volume status assessment
treatment_principles:
- 'Vasovagal: education, counter-pressure maneuvers, hydration, salt'
- 'Orthostatic: volume repletion, medication review, compression stockings'
- 'Cardiac: treat underlying cause (pacemaker, ICD, valve surgery)'
- Avoid triggers and ensure adequate hydration
- Midodrine or fludrocortisone for refractory orthostatic hypotension
disposition_guidance:
- Admit if cardiac etiology suspected or high-risk features
- Discharge vasovagal syncope with reassurance and education
- Cardiology referral for suspected arrhythmic or structural cause
- Implantable loop recorder for recurrent unexplained syncope
