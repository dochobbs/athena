id: hsv_gingivostomatitis
display_name: HSV Gingivostomatitis
aliases:
- Herpes gingivostomatitis
- Primary herpes stomatitis
- Oral herpes
- HSV-1 stomatitis
snomed: '57920007'
icd10:
- B00.2
category: acute
system: ent
specialties:
- peds
age_range:
  min_months: 6
  max_months: 72
  peak:
  - 12
  - 36
demographics:
  age_months:
    min: 6
    peak:
    - 12
    - 36
    max: 72
  gender_bias:
    male: 0.50
    female: 0.50
  risk_factors:
  - daycare_exposure
  - close_contact_with_HSV_carrier
prevalence:
  notes: Most common cause of gingivostomatitis in children 1-3 years; primary HSV-1 infection
presentation:
  symptoms:
  - name: oral pain
    probability: 0.95
    description: "severe mouth pain with refusal to eat or drink"
  - name: fever
    probability: 0.85
    description: "high fever 102-104F, often for 5-7 days"
  - name: drooling
    probability: 0.70
    description: "excessive drooling due to painful swallowing"
  - name: refusal to eat or drink
    probability: 0.85
    description: "dehydration risk from poor oral intake"
  - name: irritability
    probability: 0.75
    description: "extremely fussy and uncomfortable"
  physical_exam:
  - system: heent
    finding: "Multiple shallow ulcers on tongue, buccal mucosa, gingiva, and palate"
    probability: 0.90
  - system: heent
    finding: "Swollen, erythematous, friable gingiva that bleeds easily"
    probability: 0.80
  - system: heent
    finding: "Vesicles on lips and perioral skin"
    probability: 0.60
  - system: neck
    finding: "Anterior cervical lymphadenopathy"
    probability: 0.70
vitals_impact:
  temp_f:
  - 102.0
  - 104.0
  hr_multiplier: 1.15
treatment:
  approach: supportive_plus_antiviral
  medications:
  - agent: Acyclovir
    rxnorm: '281'
    dose_mg_kg: 15
    max_dose_mg: 200
    frequency: "5 times daily for 7 days"
    route: oral
    indication: "shortens duration if started within 72 hours of onset"
  - agent: Ibuprofen
    rxnorm: '5640'
    dose_mg_kg: 10
    max_dose_mg: 400
    frequency: "Q6H"
    route: oral
    indication: "pain and fever management"
  - agent: Magic Mouthwash
    rxnorm: '0'
    frequency: "swish and spit (or apply with sponge for young children)"
    route: topical
    indication: "topical pain relief — diphenhydramine/Maalox/viscous lidocaine"
  patient_instructions:
  - Primary HSV-1 infection — NOT the same as recurrent cold sores
  - Fever and ulcers last 5-7 days; full recovery in 10-14 days
  - Dehydration is the main complication — push cold fluids, popsicles
  - Admit for IV fluids if unable to maintain hydration
  - Acyclovir most effective if started early (within 72 hours)
  - Contagious — avoid sharing cups, utensils, kissing
  - Distinguish from hand-foot-mouth (posterior pharynx ulcers) and herpangina
  - Virus latent after primary infection — may reactivate as cold sores
