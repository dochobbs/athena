diagnostics:
  labs: []
treatment:
  approach: varies_by_etiology
  medications:
  - agent: Erythromycin Ophthalmic Ointment
    rxnorm: '310134'
    frequency: Apply 0.5 inch ribbon QID
    duration_days: 7
    route: ophthalmic
    indication: bacterial conjunctivitis
  - agent: Polymyxin B-Trimethoprim Ophthalmic
    rxnorm: '197879'
    frequency: 1-2 drops Q3H for 7-10 days
    duration_days: 7
    route: ophthalmic
    indication: bacterial conjunctivitis, alternative
  - agent: Ofloxacin Ophthalmic
    rxnorm: '198214'
    frequency: 1-2 drops Q2-4H
    duration_days: 7
    route: ophthalmic
    indication: bacterial conjunctivitis, contact lens wearers
  patient_instructions:
  - Antibiotic drops for bacterial; supportive care for viral
  - Good hand hygiene to prevent spread
  - Do not share towels, pillowcases, or eye makeup
  - May return to school 24 hours after starting treatment if bacterial
  - 'Return if: vision changes, severe pain, or photophobia'
