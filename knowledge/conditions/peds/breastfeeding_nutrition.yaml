  items:
    - category: education
      description: "Exclusive breastfeeding recommended for first 6 months"
    - category: education
      description: "Continue breastfeeding with complementary foods through 12-24 months"
    - category: education
      description: "Vitamin D 400 IU/day for all breastfed infants starting at birth"
    - category: education
      description: "Iron supplementation 1 mg/kg/day for breastfed infants starting at 4 months"
    - category: education
      description: "Formula is safe alternative; standard cow-milk formula for most infants"
    - category: education
      description: "Introduce complementary foods around 6 months (developmental readiness)"
    - category: education
      description: "Iron-rich foods first (fortified cereal, pureed meats)"
    - category: education
      description: "Introduce allergenic foods early (peanut, egg) per current guidelines"
    - category: education
      description: "No cow milk as primary drink before 12 months; no honey before 12 months"
    - category: education
      description: "Avoid juice before 12 months; limit to 4 oz/day ages 1-3"
    - category: referral
      description: "Lactation consultant for breastfeeding difficulties"
counseling_points:
  - "Breastfeeding reduces risk of otitis media, GI infections, asthma, obesity, SIDS"
  - "Feed on demand, typically 8-12 times per 24 hours in first weeks"
  - "Adequate intake: 6+ wet diapers/day by day 5, regain birth weight by 10-14 days"
  - "No water supplementation needed for breastfed or formula-fed infants under 6 months"
  - "Baby-led weaning is safe alternative to traditional spoon feeding"
  - "Choking hazards: whole grapes, hot dogs, nuts, popcorn, hard candy"
