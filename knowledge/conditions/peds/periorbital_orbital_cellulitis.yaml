id: periorbital_orbital_cellulitis
display_name: Periorbital and Orbital Cellulitis
aliases:
- Preseptal cellulitis
- Orbital cellulitis
- Periorbital cellulitis
snomed: '75543006'
icd10:
- H05.011
- H05.019
- L03.211
category: acute
system: ophthalmology
specialties:
- peds
age_range:
  min_months: 6
  max_months: 216
complexity:
  student: moderate
  resident: moderate
presentation:
  symptoms:
  - name: periorbital swelling and erythema
    probability: 0.95
    description: "Unilateral eyelid swelling, redness, and warmth"
  - name: fever
    probability: 0.60
    description: "More common with orbital cellulitis"
  - name: pain with eye movement
    probability: 0.40
    description: "Suggests orbital (postseptal) involvement"
  - name: proptosis
    probability: 0.25
    description: "Forward displacement of globe indicates orbital cellulitis"
  - name: decreased vision
    probability: 0.15
    description: "Visual impairment suggests optic nerve compromise"
  physical_exam:
  - system: ophthalmologic
    finding: "Unilateral eyelid edema, erythema, and warmth"
    probability: 0.95
  - system: ophthalmologic
    finding: "Restricted and painful extraocular movements (orbital)"
    probability: 0.35
  - system: ophthalmologic
    finding: "Proptosis with chemosis (orbital)"
    probability: 0.25
  - system: ophthalmologic
    finding: "Normal extraocular movements and visual acuity (preseptal)"
    probability: 0.60
treatment:
  approach: antibiotics_based_on_severity
  medications:
  - agent: Amoxicillin-Clavulanate
    rxnorm: '1043'
    frequency: "BID for 10 days"
    route: oral
    indication: "Uncomplicated preseptal cellulitis"
  - agent: Ampicillin-Sulbactam
    rxnorm: '733'
    frequency: "Q6H IV"
    route: intravenous
    indication: "Orbital cellulitis requiring IV therapy"
  - agent: Vancomycin
    rxnorm: '11124'
    frequency: "Q6H IV"
    route: intravenous
    indication: "Suspected MRSA or severe orbital cellulitis"
