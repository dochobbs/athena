category: acute
system: infectious_disease
specialties:
- peds
age_range:
  min_months: 48
  max_months: 216
complexity:
  student: straightforward
  resident: straightforward
presentation:
  symptoms:
  - name: fatigue
    probability: 0.95
    description: "Profound fatigue lasting weeks to months"
  - name: pharyngitis
    probability: 0.85
    description: "Severe sore throat with tonsillar exudates"
  - name: fever
    probability: 0.80
    description: "Low-grade to moderate fever, may persist 1-3 weeks"
  - name: cervical lymphadenopathy
    probability: 0.90
    description: "Bilateral posterior cervical chain adenopathy"
  - name: abdominal pain
    probability: 0.30
    description: "Left upper quadrant discomfort from splenomegaly"
  physical_exam:
  - system: heent
    finding: "Tonsillar hypertrophy with gray-white exudates"
    probability: 0.85
  - system: neck
    finding: "Bilateral posterior cervical lymphadenopathy"
    probability: 0.90
  - system: abdomen
    finding: "Splenomegaly"
    probability: 0.50
  - system: skin
    finding: "Maculopapular rash especially if amoxicillin given"
    probability: 0.30
  - system: heent
    finding: "Palatal petechiae"
    probability: 0.25
treatment:
  approach: supportive_care
  medications:
  - agent: Acetaminophen
    rxnorm: '161'
    frequency: "Q4-6H PRN"
    route: oral
    indication: "Fever and pain management"
  - agent: Ibuprofen
    rxnorm: '5640'
    frequency: "Q6H PRN"
    route: oral
    indication: "Fever and throat pain"
  - agent: Prednisone
    rxnorm: '8640'
    frequency: "Daily taper over 7-10 days"
    route: oral
    indication: "Severe tonsillar hypertrophy with airway compromise"
