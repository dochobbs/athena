- Type 2 diabetes mellitus
icd10:
- E11.9
category: chronic
system: endocrine
specialties:
- peds
age_range:
  min_months: 120
  max_months: 264
prevalence:
  notes: Increasing in pediatrics; parallels obesity epidemic
treatment:
  approach: metformin_plus_lifestyle
  items:
  - category: medication
    description: Metformin first-line medication
