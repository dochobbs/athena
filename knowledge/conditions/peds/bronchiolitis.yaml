demographics:
  age_months:
    min: 0
    peak: *id001
    max: 24
  gender_bias:
    male: 0.55
    female: 0.45
  risk_factors:
  - premature_birth
  - daycare
  - smoke_exposure
  - no_breastfeeding
  - older_siblings
prevalence:
  hospitalization_rate_under_1: 0.02
  notes: Leading cause of hospitalization in infants
seasonality:
  peak_months:
  - 11
  - 12
  - 1
  - 2
  - 3
