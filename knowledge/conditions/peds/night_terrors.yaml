id: night_terrors
display_name: Night Terrors
aliases:
- Sleep terrors
- Pavor nocturnus
- Parasomnia
snomed: '79890006'
icd10:
- F51.4
category: chronic
system: neurology
specialties:
- peds
age_range:
  min_months: 18
  max_months: 144
complexity:
  student: straightforward
  resident: straightforward
presentation:
  symptoms:
  - name: sudden arousal with screaming
    probability: 0.95
    description: "Abrupt episode of intense crying or screaming 1-3 hours after sleep onset"
  - name: inconsolable during episode
    probability: 0.90
    description: "Child appears terrified but does not recognize parents"
  - name: autonomic symptoms
    probability: 0.75
    description: "Tachycardia, diaphoresis, mydriasis during episode"
  - name: amnesia for event
    probability: 0.95
    description: "No recall of episode the next morning"
  - name: returns to sleep quickly
    probability: 0.85
    description: "Falls back asleep within minutes once episode ends"
  physical_exam:
  - system: neurologic
    finding: "Normal neurologic exam between episodes"
    probability: 0.99
  - system: neurologic
    finding: "Normal development and behavior"
    probability: 0.95
treatment:
  approach: reassurance_and_sleep_hygiene
  medications: []
