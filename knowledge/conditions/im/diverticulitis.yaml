id: diverticulitis
display_name: "Acute Diverticulitis"
aliases:
  - Diverticulitis
  - Sigmoid diverticulitis
  - Diverticular disease
snomed: "307496006"
icd10:
  - "K57.32"
  - "K57.30"
category: acute
system: gi
specialties:
  - im
age_range:
  min_months: 216
complexity:
  student: moderate
  resident: straightforward
vitals_impact:
  temp_f: [99.0, 102.0]
  hr_multiplier: 1.10
  rr_multiplier: 1.05
  spo2_min: 97
presentation:
  symptoms:
    - name: left_lower_quadrant_pain
      probability: 0.90
      description: "Acute LLQ abdominal pain, often progressive"
    - name: fever
      probability: 0.60
      description: "Low-grade to moderate fever"
    - name: nausea
      probability: 0.50
      description: "Nausea with or without vomiting"
    - name: change_in_bowel_habits
      probability: 0.45
      description: "Constipation or diarrhea"
    - name: urinary_symptoms
      probability: 0.20
      description: "Dysuria or frequency from adjacent inflammation"
  physical_exam:
    - system: abdomen
      finding: "LLQ tenderness with localized guarding"
      probability: 0.90
    - system: abdomen
      finding: "Rebound tenderness suggests perforation"
      probability: 0.20
    - system: rectal
      finding: "May have tenderness or occult blood"
      probability: 0.30
    - system: general
      finding: "Low-grade fever, mild tachycardia"
      probability: 0.55
treatment:
  approach: antibiotics_and_bowel_rest
  medications:
    - agent: "Ciprofloxacin"
      rxnorm: "2551"
      frequency: "500 mg twice daily x 7-10 days"
      route: oral
      indication: "Outpatient antibiotic for uncomplicated diverticulitis"
    - agent: "Metronidazole"
      rxnorm: "6922"
      frequency: "500 mg three times daily x 7-10 days"
      route: oral
      indication: "Anaerobic coverage paired with ciprofloxacin"
    - agent: "Piperacillin/Tazobactam"
      rxnorm: "8339"
      frequency: "3.375 g IV every 6 hours"
      route: iv
      indication: "IV antibiotics for complicated diverticulitis"
    - agent: "Acetaminophen"
      rxnorm: "161"
      frequency: "650-1000 mg every 6 hours"
      route: oral
      indication: "Analgesia (avoid NSAIDs - perforation risk)"
