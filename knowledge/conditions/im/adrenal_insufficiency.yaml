id: adrenal_insufficiency
display_name: "Adrenal Insufficiency"
aliases:
  - Addison disease
  - Primary adrenal insufficiency
  - Adrenal crisis
  - Hypoadrenalism
snomed: "386584007"
icd10:
  - "E27.1"
  - "E27.2"
  - "E27.40"
category: chronic
system: endocrine
specialties:
  - im
age_range:
  min_months: 216
complexity:
  student: challenging
  resident: moderate
vitals_impact:
  temp_f: [96.0, 100.0]
  hr_multiplier: 1.15
  rr_multiplier: 1.10
  spo2_min: 95
presentation:
  symptoms:
    - name: fatigue
      probability: 0.90
      description: "Profound, chronic fatigue"
    - name: weight_loss
      probability: 0.70
      description: "Unintentional weight loss and anorexia"
    - name: nausea_vomiting
      probability: 0.55
      description: "Nausea, vomiting, abdominal pain"
    - name: dizziness
      probability: 0.60
      description: "Orthostatic dizziness and hypotension"
    - name: salt_craving
      probability: 0.45
      description: "Craving salty foods (primary AI)"
    - name: hyperpigmentation
      probability: 0.50
      description: "Darkening of skin creases, gums, scars (primary AI)"
    - name: myalgias
      probability: 0.35
      description: "Diffuse muscle and joint pain"
  physical_exam:
    - system: cardiovascular
      finding: "Orthostatic hypotension"
      probability: 0.65
    - system: skin
      finding: "Hyperpigmentation of palmar creases, buccal mucosa, scars (primary AI)"
      probability: 0.50
    - system: general
      finding: "Cachexia, weakness, appears chronically ill"
      probability: 0.55
    - system: abdomen
      finding: "Diffuse tenderness in crisis"
      probability: 0.30
treatment:
  approach: hormone_replacement
  medications:
    - agent: "Hydrocortisone"
      rxnorm: "5492"
      frequency: "15-25 mg daily in divided doses (AM/afternoon)"
      route: oral
      indication: "Glucocorticoid replacement"
    - agent: "Fludrocortisone"
      rxnorm: "4420"
      frequency: "0.05-0.2 mg daily"
      route: oral
      indication: "Mineralocorticoid replacement (primary AI only)"
    - agent: "Hydrocortisone"
      rxnorm: "5492"
      frequency: "100 mg IV bolus then 50 mg IV every 8 hours"
      route: iv
      indication: "Adrenal crisis - stress dose steroids"
    - agent: "Dexamethasone"
      rxnorm: "3264"
      frequency: "4 mg IV"
      route: iv
      indication: "Adrenal crisis if diagnosis not yet confirmed (does not interfere with cortisol assay)"
