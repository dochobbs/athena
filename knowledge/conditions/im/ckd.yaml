id: ckd
display_name: "Chronic Kidney Disease"
aliases:
  - CKD
  - Chronic renal failure
  - Chronic renal insufficiency
snomed: "709044004"
icd10:
  - "N18.1"
  - "N18.2"
  - "N18.3"
  - "N18.4"
  - "N18.5"
  - "N18.9"
category: chronic
system: renal
specialties:
  - im
age_range:
  min_months: 216
complexity:
  student: challenging
  resident: moderate
vitals_impact:
  temp_f: [97.0, 98.6]
  hr_multiplier: 1.05
  spo2_min: 94
presentation:
  symptoms:
    - name: fatigue
      probability: 0.80
      description: "Chronic fatigue from anemia and uremia"
    - name: nausea
      probability: 0.55
      description: "Anorexia and nausea, worse in advanced stages"
    - name: edema
      probability: 0.65
      description: "Peripheral edema, worse in later stages"
    - name: pruritus
      probability: 0.50
      description: "Uremic pruritus from phosphate retention"
    - name: nocturia
      probability: 0.60
      description: "Loss of concentrating ability"
    - name: dyspnea
      probability: 0.45
      description: "From anemia or fluid overload"
    - name: cognitive_changes
      probability: 0.30
      description: "Difficulty concentrating, uremic encephalopathy late"
  physical_exam:
    - system: cardiovascular
      finding: "Hypertension, possible pericardial friction rub in advanced disease"
      probability: 0.75
    - system: skin
      finding: "Sallow complexion, excoriations from pruritus"
      probability: 0.55
    - system: extremities
      finding: "Peripheral edema, asterixis in advanced uremia"
      probability: 0.60
    - system: general
      finding: "Chronic ill appearance, muscle wasting"
      probability: 0.45
diagnostics:
  labs:
    - name: Serum Creatinine
      loinc: "2160-0"
      value_type: numeric
      unit: mg/dL
      normal_range_high: 1.2
      abnormal_high_min: 1.3
      abnormal_high_max: 12.0
      probability_abnormal: 1.0
    - name: eGFR
      loinc: "48642-3"
      value_type: numeric
      unit: mL/min/1.73m2
      normal_range_low: 60
      probability_abnormal: 1.0
    - name: Urine albumin-to-creatinine ratio
      loinc: "9318-7"
      value_type: numeric
      unit: mg/g
      normal_range_high: 30
      abnormal_high_min: 30
      probability_abnormal: 0.80
treatment:
  approach: slow_progression_manage_complications
  medications:
    - agent: "Lisinopril"
      rxnorm: "29046"
      frequency: "5-40 mg once daily"
      route: oral
      indication: "ACE inhibitor for proteinuria reduction and BP control"
    - agent: "Losartan"
      rxnorm: "52175"
      frequency: "25-100 mg once daily"
      route: oral
      indication: "ARB alternative for renoprotection"
    - agent: "Dapagliflozin"
      rxnorm: "1488564"
      frequency: "10 mg once daily"
      route: oral
      indication: "SGLT2 inhibitor for CKD progression (DAPA-CKD trial)"
    - agent: "Sevelamer"
      rxnorm: "83370"
      frequency: "800-1600 mg TID with meals"
      route: oral
      indication: "Phosphate binder for hyperphosphatemia"
    - agent: "Epoetin Alfa"
      rxnorm: "3521"
      frequency: "50-300 units/kg 3x weekly"
      route: subcutaneous
      indication: "Anemia of CKD, target Hgb 10-11.5"
  patient_instructions:
    - Monitor BP closely, target <130/80
    - Low-sodium, low-potassium, low-phosphorus diet in advanced stages
    - Avoid NSAIDs and nephrotoxic agents
    - Nephrology referral when eGFR <30 for dialysis planning
    - Annual flu and pneumococcal vaccines
    - Monitor for cardiovascular disease - leading cause of death in CKD
