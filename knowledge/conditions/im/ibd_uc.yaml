id: ibd_uc
display_name: "Ulcerative Colitis"
aliases:
  - UC
  - Ulcerative proctocolitis
  - IBD - UC
snomed: "64766004"
icd10:
  - "K51.90"
  - "K51.00"
category: chronic
system: gi
specialties:
  - im
age_range:
  min_months: 216
complexity:
  student: challenging
  resident: moderate
vitals_impact:
  temp_f: [98.0, 101.5]
  hr_multiplier: 1.10
  rr_multiplier: 1.05
  spo2_min: 96
presentation:
  symptoms:
    - name: bloody_diarrhea
      probability: 0.90
      description: "Frequent bloody, mucoid diarrhea - hallmark symptom"
    - name: urgency
      probability: 0.80
      description: "Fecal urgency and tenesmus"
    - name: abdominal_pain
      probability: 0.70
      description: "Crampy abdominal pain, often LLQ"
    - name: fatigue
      probability: 0.60
      description: "Fatigue from chronic inflammation and anemia"
    - name: weight_loss
      probability: 0.40
      description: "Weight loss in severe disease"
    - name: extraintestinal_symptoms
      probability: 0.25
      description: "Arthritis, uveitis, primary sclerosing cholangitis"
  physical_exam:
    - system: abdomen
      finding: "Diffuse or LLQ tenderness, may have distension"
      probability: 0.65
    - system: rectal
      finding: "Blood on rectal exam, rectal tenderness"
      probability: 0.80
    - system: general
      finding: "Pallor, tachycardia if anemic or dehydrated"
      probability: 0.45
    - system: skin
      finding: "Erythema nodosum or pyoderma gangrenosum"
      probability: 0.10
treatment:
  approach: topical_to_systemic_therapy
  medications:
    - agent: "Mesalamine"
      rxnorm: "30166"
      frequency: "2.4-4.8 g daily"
      route: oral
      indication: "First-line for mild-moderate UC"
    - agent: "Mesalamine Rectal"
      rxnorm: "30166"
      frequency: "1-4 g enema nightly"
      route: rectal
      indication: "Topical therapy for distal colitis"
    - agent: "Prednisone"
      rxnorm: "8640"
      frequency: "40-60 mg daily with taper"
      route: oral
      indication: "Moderate-severe flare induction"
    - agent: "Infliximab"
      rxnorm: "191831"
      frequency: "5 mg/kg IV at weeks 0, 2, 6 then every 8 weeks"
      route: iv
      indication: "Biologic for moderate-severe or steroid-refractory UC"
    - agent: "Vedolizumab"
      rxnorm: "1597868"
      frequency: "300 mg IV at weeks 0, 2, 6 then every 8 weeks"
      route: iv
      indication: "Gut-selective integrin inhibitor for UC"
