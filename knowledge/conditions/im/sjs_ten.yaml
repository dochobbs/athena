id: sjs_ten
display_name: "Stevens-Johnson Syndrome / Toxic Epidermal Necrolysis"
aliases:
  - SJS
  - TEN
  - Stevens-Johnson syndrome
  - Toxic epidermal necrolysis
  - Epidermal necrolysis
snomed: "73442001"
icd10:
  - "L51.1"
  - "L51.2"
category: acute
system: dermatology
specialties:
  - im
age_range:
  min_months: 216
complexity:
  student: challenging
  resident: moderate
vitals_impact:
  temp_f:
    - 101.0
    - 104.0
  hr_multiplier: 1.25
  spo2_min: 92
  bp_systolic:
    - 90
    - 130
presentation:
  symptoms:
    - name: prodromal flu-like illness
      probability: 0.70
      description: "fever, malaise 1-3 days before skin findings"
    - name: painful skin
      probability: 0.90
      description: "skin tenderness preceding rash"
    - name: targetoid lesions
      probability: 0.60
      description: "atypical flat target lesions progressing to bullae"
    - name: mucosal erosions
      probability: 0.90
      description: "oral, ocular, genital mucosa involvement"
    - name: skin sloughing
      probability: 0.80
      description: "epidermal detachment, SJS <10% BSA, TEN >30%"
    - name: eye pain
      probability: 0.50
      description: "conjunctival involvement, risk of scarring"
  physical_exam:
    - system: skin
      finding: "Widespread erythema with flaccid bullae and epidermal detachment"
      probability: 0.85
    - system: skin
      finding: "Positive Nikolsky sign (epidermal separation with lateral pressure)"
      probability: 0.80
    - system: oral
      finding: "Hemorrhagic erosions of oral mucosa"
      probability: 0.85
    - system: ophthalmologic
      finding: "Conjunctival injection and pseudomembrane formation"
      probability: 0.50
    - system: general
      finding: "Fever, tachycardia, hemodynamic instability"
      probability: 0.60
treatment:
  approach: discontinue_drug_burn_unit_care
  medications:
    - agent: "Normal Saline"
      rxnorm: "313002"
      frequency: "continuous infusion"
      route: iv
      indication: "aggressive fluid resuscitation as for burn patients"
    - agent: "Cyclosporine"
      rxnorm: "3008"
      frequency: "twice daily for 10-14 days"
      route: oral
      indication: "may reduce progression, emerging evidence"
    - agent: "Meropenem"
      rxnorm: "29561"
      frequency: "every 8 hours"
      route: iv
      indication: "broad-spectrum antibiotic if secondary infection suspected"
