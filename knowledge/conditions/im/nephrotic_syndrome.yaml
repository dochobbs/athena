id: nephrotic_syndrome
display_name: "Nephrotic Syndrome"
aliases:
  - Nephrosis
  - Nephrotic range proteinuria
snomed: "52254009"
icd10:
  - "N04.9"
category: acute
system: renal
specialties:
  - im
age_range:
  min_months: 216
complexity:
  student: challenging
  resident: moderate
vitals_impact:
  temp_f: [97.0, 98.6]
  hr_multiplier: 1.05
  spo2_min: 95
presentation:
  symptoms:
    - name: edema
      probability: 0.95
      description: "Periorbital edema, pedal edema, may be anasarca"
    - name: weight_gain
      probability: 0.85
      description: "Rapid weight gain from fluid retention"
    - name: foamy_urine
      probability: 0.75
      description: "Frothy urine from heavy proteinuria"
    - name: fatigue
      probability: 0.60
      description: "Generalized fatigue and malaise"
    - name: abdominal_distension
      probability: 0.45
      description: "Ascites from hypoalbuminemia"
    - name: dyspnea
      probability: 0.35
      description: "Pleural effusions in severe cases"
  physical_exam:
    - system: general
      finding: "Periorbital and facial edema, worse in morning"
      probability: 0.90
    - system: extremities
      finding: "Pitting edema of lower extremities"
      probability: 0.85
    - system: abdomen
      finding: "Ascites with shifting dullness"
      probability: 0.50
    - system: respiratory
      finding: "Decreased breath sounds at bases from effusions"
      probability: 0.35
diagnostics:
  labs:
    - name: Urine protein-to-creatinine ratio
      loinc: "2890-2"
      value_type: numeric
      unit: mg/mg
      normal_range_high: 0.2
      abnormal_high_min: 3.5
      probability_abnormal: 0.95
    - name: Serum Albumin
      loinc: "1751-7"
      value_type: numeric
      unit: g/dL
      normal_range_low: 3.5
      abnormal_low_max: 3.0
      probability_abnormal: 0.95
    - name: Total Cholesterol
      loinc: "2093-3"
      value_type: numeric
      unit: mg/dL
      normal_range_high: 200
      abnormal_high_min: 250
      probability_abnormal: 0.80
treatment:
  approach: immunosuppression_and_supportive
  medications:
    - agent: "Prednisone"
      rxnorm: "8640"
      frequency: "1 mg/kg/day (max 80 mg), taper over 6 months"
      route: oral
      indication: "First-line for minimal change disease"
    - agent: "Furosemide"
      rxnorm: "4603"
      frequency: "20-80 mg daily"
      route: oral
      indication: "Edema management"
    - agent: "Lisinopril"
      rxnorm: "29046"
      frequency: "5-20 mg daily"
      route: oral
      indication: "Proteinuria reduction"
    - agent: "Atorvastatin"
      rxnorm: "83367"
      frequency: "10-40 mg daily"
      route: oral
      indication: "Hyperlipidemia management"
  patient_instructions:
    - Low-sodium diet to reduce edema
    - Monitor daily weights
    - Renal biopsy to determine underlying cause in adults
    - VTE prophylaxis if albumin <2.5 - high thrombotic risk
    - Pneumococcal vaccination - increased infection risk
    - Monitor for signs of DVT/PE - hypercoagulable state
