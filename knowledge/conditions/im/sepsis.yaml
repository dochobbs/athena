id: sepsis
display_name: "Sepsis"
aliases:
  - Septicemia
  - Systemic inflammatory response syndrome
  - SIRS
  - Severe sepsis
snomed: "91302008"
icd10:
  - "A41.9"
  - "R65.20"
  - "R65.21"
category: acute
system: infectious_disease
specialties:
  - im
age_range:
  min_months: 216
complexity:
  student: challenging
  resident: moderate
vitals_impact:
  temp_f: [96.0, 104.0]
  hr_multiplier: 1.40
  rr_multiplier: 1.30
  bp_systolic:
    - 70
    - 100
  spo2_min: 88
presentation:
  symptoms:
    - name: fever_or_hypothermia
      probability: 0.90
      description: "high fever or paradoxical hypothermia in severe cases"
    - name: tachycardia
      probability: 0.95
      description: "heart rate >90 bpm"
    - name: altered_mental_status
      probability: 0.50
      description: "confusion, lethargy, obtundation"
    - name: hypotension
      probability: 0.60
      description: "systolic <90 or MAP <65"
    - name: rigors
      probability: 0.45
      description: "shaking chills"
    - name: tachypnea
      probability: 0.80
      description: "respiratory rate >20"
  physical_exam:
    - system: general
      finding: "Toxic-appearing, diaphoretic, ill"
      probability: 0.80
    - system: cardiovascular
      finding: "Tachycardia, hypotension, poor capillary refill"
      probability: 0.75
    - system: skin
      finding: "Mottled or cool extremities, delayed cap refill"
      probability: 0.50
    - system: neurologic
      finding: "Altered mental status, encephalopathy"
      probability: 0.50
    - system: respiratory
      finding: "Tachypnea, accessory muscle use"
      probability: 0.60
treatment:
  approach: early_goal_directed_therapy
  medications:
    - agent: "Piperacillin-Tazobactam"
      rxnorm: "54044"
      frequency: "every 6 hours"
      route: iv
      indication: "broad-spectrum empiric coverage"
    - agent: "Vancomycin"
      rxnorm: "11124"
      frequency: "every 8-12 hours"
      route: iv
      indication: "MRSA coverage if risk factors present"
    - agent: "Norepinephrine"
      rxnorm: "7512"
      frequency: "continuous infusion"
      route: iv
      indication: "first-line vasopressor for septic shock"
    - agent: "Normal Saline"
      rxnorm: "313002"
      frequency: "30 mL/kg bolus"
      route: iv
      indication: "initial fluid resuscitation"
