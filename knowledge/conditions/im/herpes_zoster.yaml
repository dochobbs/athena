id: herpes_zoster
display_name: "Herpes Zoster"
aliases:
  - Shingles
  - Zoster
  - VZV reactivation
snomed: "4740000"
icd10:
  - "B02.9"
category: acute
system: dermatology
specialties:
  - im
age_range:
  min_months: 216
complexity:
  student: straightforward
  resident: straightforward
vitals_impact:
  temp_f:
    - 98.6
    - 100.4
  hr_multiplier: 1.05
presentation:
  symptoms:
    - name: dermatomal pain
      probability: 0.90
      description: "burning, lancinating pain preceding rash by 1-3 days"
    - name: vesicular rash
      probability: 0.95
      description: "grouped vesicles on erythematous base in dermatomal distribution"
    - name: pruritus
      probability: 0.50
      description: "itching in affected dermatome"
    - name: allodynia
      probability: 0.40
      description: "pain from light touch in affected area"
    - name: postherpetic neuralgia
      probability: 0.20
      description: "persistent pain >90 days after rash onset, risk increases with age"
  physical_exam:
    - system: skin
      finding: "Grouped vesicles on erythematous base, unilateral, dermatomal"
      probability: 0.95
    - system: skin
      finding: "Does not cross midline (unilateral distribution)"
      probability: 0.95
    - system: skin
      finding: "Crusting of vesicles after 7-10 days"
      probability: 0.60
    - system: ophthalmologic
      finding: "Hutchinson sign (vesicles on nose tip) suggesting ophthalmic involvement"
      probability: 0.10
    - system: neurologic
      finding: "Hyperesthesia in affected dermatome"
      probability: 0.50
treatment:
  approach: antiviral_and_pain_management
  medications:
    - agent: "Valacyclovir"
      rxnorm: "69417"
      frequency: "three times daily for 7 days"
      route: oral
      indication: "first-line antiviral, ideally within 72 hours of rash"
    - agent: "Gabapentin"
      rxnorm: "25480"
      frequency: "three times daily"
      route: oral
      indication: "neuropathic pain and postherpetic neuralgia prevention"
    - agent: "Prednisone"
      rxnorm: "8640"
      frequency: "taper over 3 weeks"
      route: oral
      indication: "may reduce acute pain, controversial for PHN prevention"
    - agent: "Lidocaine Patch"
      rxnorm: "85990"
      frequency: "up to 12 hours on, 12 hours off"
      route: topical
      indication: "topical analgesia for postherpetic neuralgia"
