id: c_diff_colitis
display_name: "Clostridioides difficile Colitis"
aliases:
  - C. diff
  - C. difficile infection
  - CDI
  - Pseudomembranous colitis
snomed: "186431008"
icd10:
  - "A04.72"
  - "A04.71"
category: acute
system: gi
specialties:
  - im
age_range:
  min_months: 216
complexity:
  student: moderate
  resident: straightforward
vitals_impact:
  temp_f: [99.0, 102.5]
  hr_multiplier: 1.15
  rr_multiplier: 1.05
  spo2_min: 96
presentation:
  symptoms:
    - name: watery_diarrhea
      probability: 0.95
      description: "Profuse watery diarrhea, often foul-smelling, 10-15 episodes/day"
    - name: abdominal_pain
      probability: 0.70
      description: "Diffuse or lower abdominal cramping"
    - name: fever
      probability: 0.55
      description: "Low-grade to high fever"
    - name: nausea
      probability: 0.40
      description: "Nausea and anorexia"
    - name: dehydration
      probability: 0.45
      description: "Signs of volume depletion"
  physical_exam:
    - system: abdomen
      finding: "Diffuse tenderness, distension, hyperactive bowel sounds"
      probability: 0.75
    - system: abdomen
      finding: "Rebound or rigidity suggests toxic megacolon or perforation"
      probability: 0.10
    - system: general
      finding: "Fever, tachycardia, signs of dehydration"
      probability: 0.55
treatment:
  approach: targeted_antibiotics
  medications:
    - agent: "Vancomycin"
      rxnorm: "11124"
      frequency: "125 mg four times daily x 10-14 days"
      route: oral
      indication: "First-line for initial and recurrent CDI"
    - agent: "Fidaxomicin"
      rxnorm: "1111103"
      frequency: "200 mg twice daily x 10 days"
      route: oral
      indication: "Preferred for recurrent CDI, lower recurrence rate"
    - agent: "Metronidazole"
      rxnorm: "6922"
      frequency: "500 mg IV every 8 hours"
      route: iv
      indication: "Adjunct IV therapy for fulminant CDI"
